name: Deploy Cifra (Next.js) to VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get commit message
        id: commit_message
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "message=${MESSAGE}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Write .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

#      - name: Install pnpm
#        run: npm install -g pnpm@latest-10
#
#      - name: Build project
#        run: |
#          pnpm install
#          pnpm run build

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "~/projects/cifra"

      - name: Restart Next.js on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd ~/projects/cifra
            /home/push-ebx/.nvm/versions/node/v20.19.2/bin/pnpm install
            rm -rf .next
            /home/push-ebx/.nvm/versions/node/v20.19.2/bin/pnpm run build
            PORT=3090 /home/push-ebx/.nvm/versions/node/v20.19.2/bin/pm2 restart cifra --update-env || \
            PORT=3090 /home/push-ebx/.nvm/versions/node/v20.19.2/bin/pm2 start pnpm --name cifra -- start

      - name: Notify Telegram on success
        if: success()
        run: |
          DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          MESSAGE="📦 <b>Cifra Next.js — деплой успешен</b>%0A\
          %0A\
          <b>Ветка:</b> <code>${{ github.ref_name }}</code>%0A\
          <b>Автор:</b> <i>${{ github.actor }}</i>%0A\
          <b>Коммит:</b> <a href=\"$COMMIT_URL\">${{ steps.commit_message.outputs.message }}</a>%0A\
          <b>Хэш:</b> <code>${{ github.sha }}</code>%0A\
          <b>Время:</b> $DEPLOY_TIME%0A\
          <b>Репозиторий:</b> <a href=\"$REPO_URL\">${{ github.repository }}</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id=-1002701524878 \
          -d text="$MESSAGE" \
          -d parse_mode=HTML

      - name: Notify Telegram on failure
        if: failure()
        run: |
          DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          MESSAGE="🚨 <b>Cifra Next.js — деплой провален</b>%0A\
          %0A\
          <b>Ветка:</b> <code>${{ github.ref_name }}</code>%0A\
          <b>Автор:</b> <i>${{ github.actor }}</i>%0A\
          <b>Коммит:</b> <a href=\"$COMMIT_URL\">${{ steps.commit_message.outputs.message }}</a>%0A\
          <b>Хэш:</b> <code>${{ github.sha }}</code>%0A\
          <b>Время:</b> $DEPLOY_TIME%0A\
          <b>Репозиторий:</b> <a href=\"$REPO_URL\">${{ github.repository }}</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id=-1002701524878 \
          -d text="$MESSAGE" \
          -d parse_mode=HTML
